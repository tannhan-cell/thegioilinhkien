<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thế Giới Linh Kiện - Cửa Hàng Trực Tuyến</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SweetAlert2 cho thông báo mượt mà -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen">

    <!-- 1. BANNER THÔNG BÁO TỪ ADMIN -->
    <div id="siteAnnouncement" class="hidden bg-indigo-600 text-white text-xs sm:text-sm py-2.5 px-4 text-center font-medium relative shadow-sm z-40">
        <div id="announcementText" class="inline-block"></div>
        <button onclick="document.getElementById('siteAnnouncement').style.display='none'" class="absolute right-3 top-1/2 -translate-y-1/2 text-white/80 hover:text-white px-2 py-1">✕</button>
    </div>

    <!-- 2. HEADER & NAVBAR -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
            <!-- Logo -->
            <a href="javascript:void(0)" onclick="showHome()" class="flex items-center gap-2.5 font-bold text-xl text-slate-900">
                <div class="w-10 h-10 rounded-xl bg-indigo-600 text-white flex items-center justify-center text-lg shadow-md shadow-indigo-200">
                    <i class="fa-solid fa-microchip"></i>
                </div>
                <span>LinhKiện<span class="text-indigo-600">Pro</span></span>
            </a>

            <!-- Search Bar -->
            <div class="flex-1 max-w-md hidden sm:block">
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                    <input type="text" id="searchInput" onkeyup="searchProducts()" placeholder="Tìm kiếm linh kiện, thiết bị..." class="w-full pl-10 pr-4 py-2 text-sm bg-slate-100 border border-transparent rounded-xl focus:bg-white focus:border-indigo-500 focus:outline-none transition">
                </div>
            </div>

            <!-- Cart Button -->
            <button onclick="toggleCartModal()" class="relative bg-slate-100 hover:bg-slate-200 text-slate-800 p-2.5 sm:px-4 sm:py-2 rounded-xl text-sm font-semibold flex items-center gap-2.5 transition">
                <i class="fa-solid fa-cart-shopping text-indigo-600"></i>
                <span class="hidden sm:inline">Giỏ hàng</span>
                <span id="cartCount" class="bg-indigo-600 text-white text-xs font-bold px-2 py-0.5 rounded-full">0</span>
            </button>
        </div>
    </header>

    <!-- 3. MAIN CONTENT -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full space-y-8">

        <!-- CATEGORIES MENU -->
        <div class="flex items-center justify-between gap-4">
            <h2 id="sectionTitle" class="text-xl font-bold text-slate-900">Sản Phẩm Nổi Bật</h2>
            <div id="categoryContainer" class="flex items-center gap-2 overflow-x-auto pb-2 scrollbar-none">
                <button onclick="filterCategory('Tất cả')" class="cat-btn active bg-indigo-600 text-white px-4 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap shadow-sm transition">Tất cả</button>
            </div>
        </div>

        <!-- PRODUCT GRID -->
        <div id="productsGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4 sm:gap-6">
            <!-- Loading skeleton / Placeholder -->
            <div class="col-span-full text-center py-12 text-slate-400 space-y-3">
                <i class="fa-solid fa-circle-notch fa-spin text-3xl text-indigo-600"></i>
                <p class="text-sm font-medium">Đang tải danh sách sản phẩm...</p>
            </div>
        </div>

    </main>

    <!-- 4. FOOTER -->
    <footer class="bg-white border-t border-slate-200 py-6 mt-12 text-center text-xs text-slate-500">
        <p>© 2026 LinhKiệnPro - Hệ thống phân phối linh kiện uy tín.</p>
    </footer>

    <!-- 5. CART MODAL (GIỎ HÀNG) -->
    <div id="cartModal" class="fixed inset-0 bg-slate-950/40 backdrop-blur-sm hidden z-50 justify-end">
        <div class="bg-white w-full max-w-md h-full shadow-2xl flex flex-col justify-between transform transition-transform">
            <div class="p-5 border-b border-slate-100 flex items-center justify-between">
                <h3 class="font-bold text-lg text-slate-900 flex items-center gap-2">
                    <i class="fa-solid fa-bag-shopping text-indigo-600"></i> Giỏ Hàng Của Bạn
                </h3>
                <button onclick="toggleCartModal()" class="text-slate-400 hover:text-slate-600 p-1"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>

            <!-- Cart Items List -->
            <div id="cartItemsList" class="flex-1 overflow-y-auto p-5 space-y-4 divide-y divide-slate-100">
                <p class="text-center text-slate-400 py-10 text-sm">Giỏ hàng đang trống.</p>
            </div>

            <!-- Cart Footer -->
            <div class="p-5 border-t border-slate-100 bg-slate-50 space-y-4">
                <div class="flex items-center justify-between font-bold text-slate-900">
                    <span>Tổng tiền:</span>
                    <span id="cartTotalPrice" class="text-indigo-600 text-lg">0₫</span>
                </div>
                <button onclick="openCheckoutModal()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-xl shadow-md shadow-indigo-200 transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-credit-card"></i> Tiến Hành Đặt Hàng
                </button>
            </div>
        </div>
    </div>

    <!-- 6. CHECKOUT MODAL (ĐẶT HÀNG) -->
    <div id="checkoutModal" class="fixed inset-0 bg-slate-950/40 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl w-full max-w-lg overflow-hidden shadow-2xl max-h-[90vh] flex flex-col">
            <div class="p-5 border-b border-slate-100 flex items-center justify-between">
                <h3 class="font-bold text-slate-900 text-lg">Thông Tin Giao Hàng</h3>
                <button onclick="closeCheckoutModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>

            <form id="checkoutForm" onsubmit="submitOrder(event)" class="p-5 overflow-y-auto space-y-4 flex-1">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Họ và Tên *</label>
                    <input type="text" id="custName" required placeholder="Nguyễn Văn A" class="w-full px-4 py-2.5 text-sm border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Số Điện Thoại *</label>
                    <input type="tel" id="custPhone" required placeholder="0901234567" class="w-full px-4 py-2.5 text-sm border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Địa Chỉ Nhận Hàng *</label>
                    <textarea id="custAddr" required rows="2" placeholder="Số nhà, đường, phường/xã, quận/huyện..." class="w-full px-4 py-2.5 text-sm border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500"></textarea>
                </div>

                <div class="bg-slate-50 p-4 rounded-xl space-y-2 text-sm border border-slate-100">
                    <div class="font-semibold text-slate-700 mb-2">Tóm tắt đơn hàng:</div>
                    <div id="checkoutSummaryList" class="space-y-1 text-slate-600 text-xs"></div>
                    <div class="border-t border-slate-200 pt-2 flex justify-between font-bold text-slate-900 text-base">
                        <span>Tổng thanh toán:</span>
                        <span id="checkoutFinalTotal" class="text-indigo-600">0₫</span>
                    </div>
                </div>

                <button type="submit" id="btnSubmitOrder" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-xl shadow-md shadow-indigo-200 transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-paper-plane"></i> XÁC NHẬN ĐẶT HÀNG
                </button>
            </form>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        const API_URL = "https://sweet-mud-da35.nhanv1699.workers.dev";
        let allProducts = [];
        let cart = [];

        const Toast = Swal.mixin({
            toast: true,
            position: 'top-end',
            showConfirmButton: false,
            timer: 2000,
            timerProgressBar: true
        });

        // Tải thông báo từ Website API
        async function loadAnnouncement() {
            try {
                const res = await fetch(`${API_URL}/api/notify`);
                const data = await res.json();
                if (data.title && data.content) {
                    document.getElementById('announcementText').innerHTML = `📢 <strong>${data.title}:</strong> ${data.content}`;
                    document.getElementById('siteAnnouncement').style.display = 'block';
                }
            } catch (e) {}
        }

        // Tải danh sách sản phẩm
        async function fetchProducts() {
            try {
                const res = await fetch(`${API_URL}/api/products`);
                allProducts = await res.json();
                renderProducts(allProducts);
                buildCategoryMenu();
            } catch (error) {
                console.error("Lỗi:", error);
                document.getElementById('productsGrid').innerHTML = `
                    <div class="col-span-full text-center py-12 text-rose-500">
                        <i class="fa-solid fa-circle-exclamation text-3xl mb-2"></i>
                        <p class="font-medium">Không thể tải dữ liệu sản phẩm!</p>
                    </div>`;
            }
        }

        // Hiển thị sản phẩm lên Grid
        function renderProducts(list) {
            const grid = document.getElementById('productsGrid');
            if(!list || list.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400">Không tìm thấy sản phẩm nào.</div>`;
                return;
            }

            grid.innerHTML = list.map(p => {
                const stock = p.stock !== undefined ? p.stock : 100;
                const isOut = stock <= 0;
                return `
                <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden flex flex-col justify-between hover:shadow-md transition">
                    <div class="relative">
                        <img src="${p.img || 'https://via.placeholder.com/300'}" alt="${p.name}" class="w-full h-40 sm:h-48 object-cover bg-slate-100">
                        <span class="absolute top-2.5 left-2.5 bg-slate-900/80 backdrop-blur-md text-white text-[10px] font-semibold px-2 py-0.5 rounded-md">${p.cat}</span>
                    </div>
                    <div class="p-4 flex-1 flex flex-col justify-between space-y-3">
                        <div>
                            <h3 class="font-bold text-sm text-slate-900 line-clamp-2">${p.name}</h3>
                            <div class="text-indigo-600 font-bold text-base mt-1">${Number(p.price).toLocaleString()}₫</div>
                        </div>
                        
                        <button onclick="addToCart('${p.id}')" ${isOut ? 'disabled' : ''} 
                            class="w-full py-2.5 rounded-xl text-xs font-semibold flex items-center justify-center gap-1.5 transition ${
                                isOut 
                                ? 'bg-slate-100 text-slate-400 cursor-not-allowed' 
                                : 'bg-indigo-50 hover:bg-indigo-600 text-indigo-600 hover:text-white'
                            }">
                            ${isOut ? 'Hết hàng' : '<i class="fa-solid fa-cart-plus"></i> Thêm vào giỏ'}
                        </button>
                    </div>
                </div>`;
            }).join('');
        }

        // Tạo menu danh mục
        function buildCategoryMenu() {
            const categories = [...new Set(allProducts.map(p => p.cat).filter(Boolean))];
            const container = document.getElementById('categoryContainer');
            let html = `<button onclick="filterCategory('Tất cả', this)" class="cat-btn active bg-indigo-600 text-white px-4 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap shadow-sm transition">Tất cả</button>`;
            
            categories.forEach(cat => {
                html += `<button onclick="filterCategory('${cat}', this)" class="cat-btn bg-white hover:bg-slate-100 text-slate-600 px-4 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap border border-slate-200 transition">${cat}</button>`;
            });
            container.innerHTML = html;
        }

        function filterCategory(cat, btn) {
            document.querySelectorAll('.cat-btn').forEach(b => {
                b.className = "cat-btn bg-white hover:bg-slate-100 text-slate-600 px-4 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap border border-slate-200 transition";
            });
            if(btn) btn.className = "cat-btn active bg-indigo-600 text-white px-4 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap shadow-sm transition";

            document.getElementById('sectionTitle').innerText = cat === 'Tất cả' ? 'Sản Phẩm Nổi Bật' : `Danh Mục: ${cat}`;
            const filtered = cat === 'Tất cả' ? allProducts : allProducts.filter(p => p.cat === cat);
            renderProducts(filtered);
        }

        // Thêm vào giỏ hàng
        function addToCart(id) {
            const item = allProducts.find(p => p.id === id);
            if(!item) return;

            const exist = cart.find(c => c.id === id);
            if(exist) {
                exist.qty += 1;
            } else {
                cart.push({ ...item, qty: 1 });
            }
            updateCartUI();
            Toast.fire({ icon: 'success', title: `Đã thêm vào giỏ hàng!` });
        }

        // Cập nhật giao diện giỏ hàng
        function updateCartUI() {
            const totalQty = cart.reduce((s, i) => s + i.qty, 0);
            const totalPrice = cart.reduce((s, i) => s + (i.price * i.qty), 0);

            document.getElementById('cartCount').innerText = totalQty;
            document.getElementById('cartTotalPrice').innerText = totalPrice.toLocaleString() + '₫';

            const listContainer = document.getElementById('cartItemsList');
            if(cart.length === 0) {
                listContainer.innerHTML = `<p class="text-center text-slate-400 py-10 text-sm">Giỏ hàng đang trống.</p>`;
                return;
            }

            listContainer.innerHTML = cart.map((item, idx) => `
                <div class="pt-3 flex items-center justify-between gap-3">
                    <img src="${item.img || 'https://via.placeholder.com/80'}" class="w-12 h-12 rounded-lg object-cover bg-slate-100">
                    <div class="flex-1">
                        <h4 class="font-semibold text-xs text-slate-800 line-clamp-1">${item.name}</h4>
                        <div class="text-indigo-600 font-bold text-xs mt-0.5">${(item.price * item.qty).toLocaleString()}₫</div>
                    </div>
                    <div class="flex items-center gap-2 border border-slate-200 rounded-lg px-2 py-1 bg-white">
                        <button onclick="changeQty(${idx}, -1)" class="text-slate-400 hover:text-slate-700 text-xs">-</button>
                        <span class="text-xs font-semibold w-4 text-center">${item.qty}</span>
                        <button onclick="changeQty(${idx}, 1)" class="text-slate-400 hover:text-slate-700 text-xs">+</button>
                    </div>
                    <button onclick="removeItem(${idx})" class="text-slate-300 hover:text-rose-500 transition"><i class="fa-solid fa-trash text-xs"></i></button>
                </div>
            `).join('');
        }

        function changeQty(idx, delta) {
            if(cart[idx].qty + delta > 0) {
                cart[idx].qty += delta;
            } else {
                cart.splice(idx, 1);
            }
            updateCartUI();
        }

        function removeItem(idx) {
            cart.splice(idx, 1);
            updateCartUI();
        }

        function toggleCartModal() {
            const m = document.getElementById('cartModal');
            m.classList.toggle('hidden');
            m.classList.toggle('flex');
        }

        function openCheckoutModal() {
            if(cart.length === 0) return Toast.fire({ icon: 'warning', title: 'Giỏ hàng đang trống!' });
            toggleCartModal();

            const summaryList = document.getElementById('checkoutSummaryList');
            const total = cart.reduce((s, i) => s + (i.price * i.qty), 0);
            
            summaryList.innerHTML = cart.map(i => `
                <div class="flex justify-between">
                    <span>${i.name} (x${i.qty})</span>
                    <span class="font-semibold">${(i.price * i.qty).toLocaleString()}₫</span>
                </div>
            `).join('');
            document.getElementById('checkoutFinalTotal').innerText = total.toLocaleString() + '₫';

            const modal = document.getElementById('checkoutModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeCheckoutModal() {
            const modal = document.getElementById('checkoutModal');
            modal.classList.remove('flex');
            modal.classList.add('hidden');
        }

        // Gửi đơn hàng lên API Cloudflare Worker
        async function submitOrder(e) {
            e.preventDefault();
            const btn = document.getElementById('btnSubmitOrder');
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> ĐANG XỬ LÝ...`;

            const orderData = {
                name: document.getElementById('custName').value,
                phone: document.getElementById('custPhone').value,
                address: document.getElementById('custAddr').value,
                total: cart.reduce((s, i) => s + (i.price * i.qty), 0)
            };

            try {
                const res = await fetch(`${API_URL}/api/orders`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(orderData)
                });

                if (res.ok) {
                    closeCheckoutModal();
                    Swal.fire({
                        icon: 'success',
                        title: 'Đặt hàng thành công!',
                        text: 'Cảm ơn bạn đã ủng hộ. Cửa hàng sẽ liên hệ sớm nhất!',
                        confirmButtonColor: '#4F46E5'
                    });
                    cart = [];
                    updateCartUI();
                } else {
                    Toast.fire({ icon: 'error', title: 'Không thể đặt hàng. Vui lòng thử lại!' });
                }
            } catch (err) {
                Toast.fire({ icon: 'error', title: 'Lỗi kết nối máy chủ!' });
            } finally {
                btn.disabled = false;
                btn.innerText = "XÁC NHẬN ĐẶT HÀNG";
            }
        }

        // Tìm kiếm
        function searchProducts() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allProducts.filter(p => p.name.toLowerCase().includes(q) || p.cat.toLowerCase().includes(q));
            renderProducts(filtered);
        }

        function showHome() {
            document.getElementById('searchInput').value = '';
            filterCategory('Tất cả');
        }

        // Khởi chạy khi trang web sẵn sàng
        window.onload = () => {
            fetchProducts();
            loadAnnouncement();
        };
    </script>
</body>
</html>
