<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Cửa Hàng - Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 flex h-screen overflow-hidden">

    <!-- SIDEBAR -->
    <aside class="w-64 bg-slate-900 text-slate-300 flex flex-col justify-between hidden md:flex z-20">
        <div>
            <div class="h-16 flex items-center px-6 bg-slate-950 font-bold text-xl text-white gap-3">
                <i class="fa-solid fa-store text-indigo-500"></i>
                <span>Admin Pro</span>
            </div>
            <nav class="p-4 space-y-1">
                <a href="#products" onclick="switchTab('products')" id="nav-products" class="flex items-center gap-3 px-4 py-3 text-sm font-medium rounded-xl bg-indigo-600 text-white shadow-lg shadow-indigo-500/30 transition">
                    <i class="fa-solid fa-box text-base"></i> Quản lý sản phẩm
                </a>
                <a href="#orders" onclick="switchTab('orders')" id="nav-orders" class="flex items-center gap-3 px-4 py-3 text-sm font-medium rounded-xl hover:bg-slate-800 hover:text-white transition">
                    <i class="fa-solid fa-cart-shopping text-base"></i> Quản lý đơn hàng
                </a>
                <a href="#notify" onclick="switchTab('notify')" id="nav-notify" class="flex items-center gap-3 px-4 py-3 text-sm font-medium rounded-xl hover:bg-slate-800 hover:text-white transition">
                    <i class="fa-solid fa-bullhorn text-base"></i> Thông báo Web
                </a>
            </nav>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <div class="flex-1 flex flex-col h-screen overflow-hidden">
        <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-6 z-10">
            <h1 id="pageTitle" class="text-xl font-bold text-slate-900">Danh Sách Sản Phẩm</h1>
            <div id="headerActions">
                <button onclick="openProductModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-xl text-sm font-semibold transition flex items-center gap-2">
                    <i class="fa-solid fa-plus"></i> Thêm Sản Phẩm
                </button>
            </div>
        </header>

        <main class="flex-1 overflow-y-auto p-6 space-y-6">

            <!-- TAB 1: SẢN PHẨM -->
            <div id="tab-products" class="space-y-6">
                <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm">
                            <thead class="bg-slate-50 border-b border-slate-100 text-slate-500 uppercase text-xs font-semibold">
                                <tr>
                                    <th class="py-3.5 px-4">Sản Phẩm</th>
                                    <th class="py-3.5 px-4">Danh Mục</th>
                                    <th class="py-3.5 px-4">Giá Bán</th>
                                    <th class="py-3.5 px-4">Tồn Kho</th>
                                    <th class="py-3.5 px-4 text-right">Thao Tác</th>
                                </tr>
                            </thead>
                            <tbody id="productTableBody" class="divide-y divide-slate-100"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- TAB 2: ĐƠN HÀNG KHÁCH HÀNG -->
            <div id="tab-orders" class="hidden space-y-6">
                <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                    <div class="p-4 border-b border-slate-100 flex items-center justify-between">
                        <h3 class="font-bold text-slate-800">Danh Sách Đơn Hàng Từ Khách</h3>
                        <button onclick="loadOrders()" class="p-2 text-slate-500 hover:text-indigo-600 rounded-xl"><i class="fa-solid fa-rotate-right"></i> Làm mới</button>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm">
                            <thead class="bg-slate-50 border-b border-slate-100 text-slate-500 uppercase text-xs font-semibold">
                                <tr>
                                    <th class="py-3.5 px-4">Mã Đơn</th>
                                    <th class="py-3.5 px-4">Khách Hàng</th>
                                    <th class="py-3.5 px-4">SĐT / Email</th>
                                    <th class="py-3.5 px-4">Địa Chỉ</th>
                                    <th class="py-3.5 px-4">Tổng Tiền</th>
                                    <th class="py-3.5 px-4 text-right">Thao Tác</th>
                                </tr>
                            </thead>
                            <tbody id="orderTableBody" class="divide-y divide-slate-100"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- TAB 3: THÔNG BÁO -->
            <div id="tab-notify" class="hidden max-w-2xl mx-auto">
                <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                    <h2 class="text-lg font-bold">Phát Thông Báo Website</h2>
                    <input type="text" id="notifyTitle" placeholder="Tiêu đề thông báo..." class="w-full px-4 py-2 border rounded-xl">
                    <textarea id="notifyContent" rows="4" placeholder="Nội dung chi tiết..." class="w-full px-4 py-2 border rounded-xl"></textarea>
                    <button onclick="sendWebNotification()" class="w-full bg-indigo-600 text-white font-semibold py-2.5 rounded-xl">Phát Thông Báo</button>
                </div>
            </div>

        </main>
    </div>

    <!-- MODAL THÊM/SỬA SẢN PHẨM -->
    <div id="productModal" class="fixed inset-0 bg-slate-950/40 hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl w-full max-w-md p-6 space-y-4 max-h-[90vh] overflow-y-auto">
            <h3 id="modalTitle" class="font-bold text-lg">Thêm Sản Phẩm</h3>
            <form id="productForm" onsubmit="handleSaveProduct(event)" class="space-y-3">
                <input type="hidden" id="pId">
                
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Tên Sản Phẩm *</label>
                    <input type="text" id="pName" required placeholder="Tên sản phẩm..." class="w-full px-3.5 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-indigo-500">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Danh Mục *</label>
                        <input type="text" id="pCat" required placeholder="Danh mục..." class="w-full px-3.5 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Giá Bán (VNĐ) *</label>
                        <input type="number" id="pPrice" required placeholder="Giá bán..." class="w-full px-3.5 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-indigo-500">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Số Lượng Tồn Kho</label>
                    <input type="number" id="pStock" value="100" placeholder="Tồn kho" class="w-full px-3.5 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-indigo-500">
                </div>

                <!-- KHU VỰC TẢI CẢNH TỪ MÁY TÍNH / URL -->
                <div class="space-y-2 border-t pt-3">
                    <label class="block text-xs font-semibold text-slate-600">Hình Ảnh Sản Phẩm</label>
                    
                    <!-- 1. Tải từ máy tính -->
                    <div class="flex flex-col gap-1">
                        <span class="text-[11px] text-slate-500">Tải ảnh từ máy tính:</span>
                        <input type="file" id="pImgFile" accept="image/*" onchange="handleFileSelect(event)" class="w-full text-xs text-slate-500 file:mr-3 file:py-2 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 cursor-pointer">
                    </div>

                    <div class="text-center text-xs text-slate-400 font-medium">- Hoặc -</div>

                    <!-- 2. Nhập URL -->
                    <input type="url" id="pImg" placeholder="Dán đường dẫn ảnh (URL)..." oninput="handleUrlInput(this.value)" class="w-full px-3.5 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-indigo-500">

                    <!-- Vùng hiển thị xem trước ảnh -->
                    <div id="previewContainer" class="hidden items-center gap-3 p-2 bg-slate-50 rounded-xl border border-slate-200 mt-2">
                        <img id="imgPreview" src="" class="w-16 h-16 object-cover rounded-lg border border-slate-200">
                        <div class="flex-1">
                            <p class="text-xs font-semibold text-slate-700">Xem trước hình ảnh</p>
                            <button type="button" onclick="removeImage()" class="text-xs text-rose-500 hover:underline mt-1">Xóa ảnh này</button>
                        </div>
                    </div>
                </div>

                <div class="flex justify-end gap-2 pt-3 border-t">
                    <button type="button" onclick="closeProductModal()" class="px-4 py-2 text-sm text-slate-600 font-semibold">Hủy</button>
                    <button type="submit" id="btnSave" class="px-5 py-2 text-sm bg-indigo-600 text-white rounded-xl font-semibold shadow-md shadow-indigo-200 hover:bg-indigo-700">Lưu Sản Phẩm</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_URL = "https://sweet-mud-da35.nhanv1699.workers.dev";
        let products = [], orders = [];
        let currentImageBase64 = ""; // Biến lưu chuỗi ảnh Base64 từ máy tính

        const Toast = Swal.mixin({ toast: true, position: 'top-end', showConfirmButton: false, timer: 2000 });

        async function loadProducts() {
            try {
                const res = await fetch(`${API_URL}/api/products`);
                const data = await res.json();
                products = Array.isArray(data) ? data : (data.products || []);
                renderProducts(products);
            } catch(e) { console.error(e); }
        }

        function renderProducts(list) {
            const tbody = document.getElementById('productTableBody');
            if(!list.length) { tbody.innerHTML = `<tr><td colspan="5" class="text-center py-6 text-slate-400">Không có sản phẩm nào</td></tr>`; return; }
            tbody.innerHTML = list.map(p => `
                <tr class="hover:bg-slate-50">
                    <td class="py-3 px-4 flex items-center gap-3">
                        <img src="${p.img || 'https://via.placeholder.com/80'}" class="w-10 h-10 rounded-lg object-cover border border-slate-200">
                        <span class="font-semibold text-slate-800">${p.name || ''}</span>
                    </td>
                    <td class="py-3 px-4">${p.cat || ''}</td>
                    <td class="py-3 px-4 font-bold text-slate-900">${Number(p.price || 0).toLocaleString()}₫</td>
                    <td class="py-3 px-4">${p.stock || 0}</td>
                    <td class="py-3 px-4 text-right space-x-1">
                        <button onclick="editProduct('${p.id}')" class="text-indigo-600 hover:bg-indigo-50 p-2 rounded-lg" title="Sửa"><i class="fa-solid fa-pen-to-square"></i></button>
                        <button onclick="deleteProduct('${p.id}')" class="text-rose-500 hover:bg-rose-50 p-2 rounded-lg" title="Xóa"><i class="fa-solid fa-trash"></i></button>
                    </td>
                </tr>
            `).join('');
        }

        // XỬ LÝ CHỌN FILE ẢNH TỪ MÁY TÍNH
        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file) {
                // Kiểm tra dung lượng (khuyên dùng dưới 3MB)
                if (file.size > 3 * 1024 * 1024) {
                    Toast.fire({ icon: 'warning', title: 'Ảnh quá lớn! Vui lòng chọn ảnh < 3MB' });
                    event.target.value = "";
                    return;
                }
                const reader = new FileReader();
                reader.onload = function(e) {
                    currentImageBase64 = e.target.result;
                    document.getElementById('pImg').value = ""; // Xóa bớt ô URL
                    showImagePreview(currentImageBase64);
                };
                reader.readAsDataURL(file);
            }
        }

        // XỬ LÝ NHẬP URL
        function handleUrlInput(url) {
            if(url.trim()) {
                currentImageBase64 = ""; 
                document.getElementById('pImgFile').value = "";
                showImagePreview(url.trim());
            } else {
                hideImagePreview();
            }
        }

        function showImagePreview(src) {
            document.getElementById('imgPreview').src = src;
            document.getElementById('previewContainer').classList.remove('hidden');
            document.getElementById('previewContainer').classList.add('flex');
        }

        function hideImagePreview() {
            document.getElementById('imgPreview').src = "";
            document.getElementById('previewContainer').classList.remove('flex');
            document.getElementById('previewContainer').classList.add('hidden');
        }

        function removeImage() {
            currentImageBase64 = "";
            document.getElementById('pImgFile').value = "";
            document.getElementById('pImg').value = "";
            hideImagePreview();
        }

        function editProduct(id) {
            const p = products.find(item => String(item.id) === String(id));
            if(p) openProductModal(p);
        }

        function openProductModal(p = null) {
            document.getElementById('productForm').reset();
            removeImage();

            if(p) {
                document.getElementById('modalTitle').innerText = "Cập Nhật Sản Phẩm";
                document.getElementById('pId').value = p.id;
                document.getElementById('pName').value = p.name || '';
                document.getElementById('pCat').value = p.cat || '';
                document.getElementById('pPrice').value = p.price || 0;
                document.getElementById('pStock').value = p.stock || 0;
                
                if(p.img) {
                    if(p.img.startsWith('data:image')) {
                        currentImageBase64 = p.img;
                    } else {
                        document.getElementById('pImg').value = p.img;
                    }
                    showImagePreview(p.img);
                }
            } else {
                document.getElementById('modalTitle').innerText = "Thêm Sản Phẩm Mới";
                document.getElementById('pId').value = '';
            }
            document.getElementById('productModal').classList.remove('hidden');
            document.getElementById('productModal').classList.add('flex');
        }

        function closeProductModal() { 
            document.getElementById('productModal').classList.add('hidden'); 
            document.getElementById('productModal').classList.remove('flex'); 
        }

        async function handleSaveProduct(e) {
            e.preventDefault();
            const btnSave = document.getElementById('btnSave');
            btnSave.disabled = true;
            btnSave.innerText = "Đang lưu...";

            // Ưu tiên chọn ảnh từ máy tính (Base64), sau đó đến link URL
            const finalImg = currentImageBase64 || document.getElementById('pImg').value;

            const productData = {
                id: document.getElementById('pId').value || null,
                name: document.getElementById('pName').value,
                cat: document.getElementById('pCat').value,
                price: Number(document.getElementById('pPrice').value),
                stock: Number(document.getElementById('pStock').value),
                img: finalImg
            };

            try {
                const res = await fetch(`${API_URL}/api/admin/products`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(productData)
                });

                if(res.ok) {
                    Toast.fire({ icon: 'success', title: 'Đã lưu sản phẩm thành công!' });
                    closeProductModal();
                    loadProducts();
                } else {
                    Toast.fire({ icon: 'error', title: 'Không thể lưu sản phẩm!' });
                }
            } catch(err) {
                Toast.fire({ icon: 'error', title: 'Lỗi kết nối Server!' });
            } finally {
                btnSave.disabled = false;
                btnSave.innerText = "Lưu Sản Phẩm";
            }
        }

        async function deleteProduct(id) {
            if(confirm("Bạn chắc chắn muốn xóa sản phẩm này?")) {
                await fetch(`${API_URL}/api/admin/products/delete`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({id}) });
                Toast.fire({ icon: 'success', title: 'Đã xóa sản phẩm!' });
                loadProducts();
            }
        }

        async function loadOrders() {
            try {
                const res = await fetch(`${API_URL}/api/admin/orders`);
                const data = await res.json();
                orders = Array.isArray(data) ? data : (data.orders || []);
                renderOrders(orders);
            } catch(e) { console.error(e); }
        }

        function renderOrders(list) {
            const tbody = document.getElementById('orderTableBody');
            if(!list.length) { tbody.innerHTML = `<tr><td colspan="6" class="text-center py-6 text-slate-400">Chưa có đơn hàng nào</td></tr>`; return; }
            tbody.innerHTML = list.map(o => `
                <tr class="hover:bg-slate-50">
                    <td class="py-3 px-4 font-bold text-indigo-600">${o.id}</td>
                    <td class="py-3 px-4 font-semibold">${o.name || o.customerName || 'N/A'}</td>
                    <td class="py-3 px-4">${o.phone || o.email || 'N/A'}</td>
                    <td class="py-3 px-4 max-w-xs truncate">${o.address || 'N/A'}</td>
                    <td class="py-3 px-4 font-bold text-emerald-600">${Number(o.total || o.totalPrice || 0).toLocaleString()}₫</td>
                    <td class="py-3 px-4 text-right">
                        <button onclick="deleteOrder('${o.id}')" class="text-rose-500 hover:bg-rose-50 p-2 rounded-lg" title="Xóa đơn"><i class="fa-solid fa-trash"></i></button>
                    </td>
                </tr>
            `).join('');
        }

        async function deleteOrder(id) {
            if(confirm("Xóa đơn hàng này?")) {
                await fetch(`${API_URL}/api/admin/orders/delete`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({id}) });
                loadOrders();
            }
        }

        async function sendWebNotification() {
            const title = document.getElementById('notifyTitle').value;
            const content = document.getElementById('notifyContent').value;
            if(!title || !content) return Toast.fire({ icon: 'warning', title: 'Vui lòng nhập đủ nội dung!' });

            await fetch(`${API_URL}/api/admin/notify`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ title, content })
            });
            Toast.fire({ icon: 'success', title: 'Đã phát thông báo!' });
            document.getElementById('notifyTitle').value = '';
            document.getElementById('notifyContent').value = '';
        }

        function switchTab(tab) {
            document.getElementById('tab-products').classList.add('hidden');
            document.getElementById('tab-orders').classList.add('hidden');
            document.getElementById('tab-notify').classList.add('hidden');
            document.getElementById(`tab-${tab}`).classList.remove('hidden');

            document.getElementById('nav-products').className = "flex items-center gap-3 px-4 py-3 text-sm font-medium rounded-xl hover:bg-slate-800 hover:text-white transition";
            document.getElementById('nav-orders').className = "flex items-center gap-3 px-4 py-3 text-sm font-medium rounded-xl hover:bg-slate-800 hover:text-white transition";
            document.getElementById('nav-notify').className = "flex items-center gap-3 px-4 py-3 text-sm font-medium rounded-xl hover:bg-slate-800 hover:text-white transition";

            if(tab === 'orders') {
                document.getElementById('pageTitle').innerText = "Quản Lý Đơn Hàng";
                document.getElementById('nav-orders').className = "flex items-center gap-3 px-4 py-3 text-sm font-medium rounded-xl bg-indigo-600 text-white shadow-lg shadow-indigo-500/30 transition";
                loadOrders();
            } else if(tab === 'products') {
                document.getElementById('pageTitle').innerText = "Danh Sách Sản Phẩm";
                document.getElementById('nav-products').className = "flex items-center gap-3 px-4 py-3 text-sm font-medium rounded-xl bg-indigo-600 text-white shadow-lg shadow-indigo-500/30 transition";
                loadProducts();
            } else {
                document.getElementById('pageTitle').innerText = "Thông Báo Web";
                document.getElementById('nav-notify').className = "flex items-center gap-3 px-4 py-3 text-sm font-medium rounded-xl bg-indigo-600 text-white shadow-lg shadow-indigo-500/30 transition";
            }
        }

        window.onload = loadProducts;
    </script>
</body>
</html>
